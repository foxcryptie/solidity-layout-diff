[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solidity-layout-diff"
version = "0.1.0"
description = "Offline Solidity storage layout comparison with conservative upgrade diagnostics"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "foxcryptie"}]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Quality Assurance"]

[project.scripts]
slotdiff = "slotdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

